# =====================================================================
#                   Models for Gold/Core
# =====================================================================

version: 2

models:
  - name: fct_proposals_regions_bands
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - proposal_id
              - region_id
              - band_id
    columns:
      - name: band_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_bands')
                field: band_id
      - name: proposal_id
        data_tests:
          - not_null
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_id
      - name: n_spw_reg
      - name: total_time_science_reg
      - name: total_time_setup_reg
      - name: total_time_reg
      - name: date_start
      - name: date_end
      - name: _date_load

  - name: dim_bands
    columns:
      - name: band_id
        data_tests:
          - unique
          - not_null
      - name: band_name
        data_tests:
          - unique
          - not_null
      - name: _date_load

  - name: dim_regions
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null
      - name: region_code
        data_tests:
          - unique
          - not_null
      - name: region_name
      - name: region_type
      - name: ra_deg
      - name: dec_deg
      - name: gal_l_deg
      - name: gal_b_deg
      - name: radius_deg
      - name: note

  - name: dim_pis
    columns:
      - name: pi_id
        data_tests:
          - unique
          - not_null
      - name: pi_userid
        data_tests:
          - unique
          - not_null
      - name: pi_name
      - name: _date_load

  - name: dim_scientific_category
    columns:
      - name: scientific_category_id
        data_tests:
          - unique
          - not_null
      - name: scientific_category
        data_tests:
          - unique
          - not_null
      - name: _date_load