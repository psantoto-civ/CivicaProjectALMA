# =====================================================================
#                   Models for Gold/Core
# =====================================================================

version: 2

models:
  - name: fct_proposals
    columns:
      - name: proposal_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: obs_publisher_did
        data_type: varchar
      - name: proposal_abstract
        data_type: varchar
      - name: n_authors
        data_type: number(18, 0)
      - name: total_observing_time_science
        data_type: float
      - name: total_observing_time_setup
        data_type: float
      - name: total_observing_time
        data_type: float
      - name: date_start
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: date_end
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: total_time_span
        data_type: float
      - name: n_spws
        data_type: number(38, 0)
      - name: pi_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_pis')
                field: pi_id
      - name: scientific_category_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_scientific_category')
                field: scientific_category_id
      - name: _date_load
        data_type: timestamp_ntz

  - name: fct_proposals_regions_bands
    description: >
      Proyecto x región x banda. Recuentos con proyectos distintos; horas repartidas entre las bandas
      del proyecto (band_weight), exactas al sumar por región, proyecto o total. No usar horas por banda.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - proposal_id
              - region_id
              - band_id
    columns:
      - name: proposal_region_band_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: band_id
        data_type: varchar
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_bands')
                field: band_id
      - name: proposal_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_proposals')
                field: proposal_id
      - name: region_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_id
      - name: band_weight
        data_type: float   # 1 / nº de bandas en float (antes NUMBER(7,6): 1/3 = 0,333333)
        constraints:
          - type: not_null
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: time_science_alloc
        data_type: float
      - name: time_setup_alloc
        data_type: float
      - name: time_total_alloc
        data_type: float
      - name: date_start
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: date_end
        data_type: date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: _date_load
        data_type: timestamp_ntz

  - name: dim_bands
    columns:
      - name: band_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: band_name
        data_type: number(38, 0)
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: _date_load
        data_type: timestamp_ntz

  - name: dim_regions
    columns:
      - name: region_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: region_code
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: region_name
        data_type: varchar
      - name: region_type
        data_type: varchar
      - name: priority
        data_type: number(3, 0)
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: rule
        data_type: varchar
        constraints:
          - type: not_null
      - name: ra_deg
        data_type: float
      - name: dec_deg
        data_type: float
      - name: gal_l_deg
        data_type: float
      - name: gal_b_deg
        data_type: float
      - name: radius_deg
        data_type: float
      - name: abs_l_max_deg
        data_type: float
      - name: abs_b_min_deg
        data_type: float
      - name: abs_b_max_deg
        data_type: float

  - name: dim_pis
    columns:
      - name: pi_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: pi_userid
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: pi_name
        data_type: varchar
      - name: _date_load
        data_type: timestamp_ntz

  - name: dim_scientific_category
    columns:
      - name: scientific_category_id
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: scientific_category
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: _date_load
        data_type: timestamp_ntz

  - name: dim_fecha
    columns:
      - name: date_day
        data_type: date
        constraints:
          - type: not_null
        data_tests:
          - unique
      - name: year
        data_type: number(4, 0)
      - name: semester
        data_type: number(1, 0)
      - name: quarter
        data_type: number(1, 0)
      - name: month
        data_type: number(2, 0)
      - name: month_name
        data_type: varchar
      - name: alma_cycle
        data_type: number(2, 0)