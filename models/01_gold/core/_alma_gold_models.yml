# =====================================================================
#                   Models for Gold/Core
# =====================================================================

version: 2

models:
  - name: fct_proposals
    columns:
      - name: proposal_id
        data_tests:
          - unique
          - not_null
      - name: obs_publisher_did
      - name: proposal_abstract
      - name: n_authors
      - name: total_observing_time_science
      - name: total_observing_time_setup
      - name: total_observing_time
      - name: date_start
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: date_end
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: total_time_span
      - name: n_spws
      - name: pi_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pis')
                field: pi_id
      - name: scientific_category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_scientific_category')
                field: scientific_category_id
      - name: _date_load

  - name: fct_proposals_regions_bands
    description: >
      Proyecto × región × banda. Recuentos con proyectos distintos; horas repartidas entre las bandas
      del proyecto (band_weight), exactas al sumar por región, proyecto o total. No usar horas por banda.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - proposal_id
              - region_id
              - band_id
    columns:
      - name: proposal_region_band_id
        data_tests:
          - unique
          - not_null
      - name: band_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_bands')
                field: band_id
      - name: proposal_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_proposals')
                field: proposal_id
      - name: region_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_regions')
                field: region_id
      - name: band_weight
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: time_science_alloc
      - name: time_setup_alloc
      - name: time_total_alloc
      - name: date_start
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: date_end
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: date_day
      - name: _date_load

  - name: dim_bands
    columns:
      - name: band_id
        data_tests:
          - unique
          - not_null
      - name: band_name
        data_tests:
          - unique
          - not_null
      - name: _date_load

  - name: dim_regions
    columns:
      - name: region_id
        data_tests:
          - unique
          - not_null
      - name: region_code
        data_tests:
          - unique
          - not_null
      - name: region_name
      - name: region_type
      - name: priority
        data_tests:
          - unique
          - not_null
      - name: rule
        data_tests:
          - not_null
      - name: ra_deg
      - name: dec_deg
      - name: gal_l_deg
      - name: gal_b_deg
      - name: radius_deg
      - name: abs_l_max_deg
      - name: abs_b_min_deg
      - name: abs_b_max_deg

  - name: dim_pis
    columns:
      - name: pi_id
        data_tests:
          - unique
          - not_null
      - name: pi_userid
        data_tests:
          - unique
          - not_null
      - name: pi_name
      - name: _date_load

  - name: dim_scientific_category
    columns:
      - name: scientific_category_id
        data_tests:
          - unique
          - not_null
      - name: scientific_category
        data_tests:
          - unique
          - not_null
      - name: _date_load

  - name: dim_fecha
    columns:
      - name: date_day
        data_tests:
          - unique
          - not_null
      - name: year
      - name: semester
      - name: quarter
      - name: month
      - name: month_name
      - name: alma_cycle