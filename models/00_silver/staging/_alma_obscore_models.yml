# Descripciones de columnas en _alma_obscore_docs.md (bloques {% docs obscore_<columna> %}).

version: 2

models:
  - name: stg_alma_obscore_clean
    description: >
      Versión vigente de cada ventana espectral de ivoa.obscore, tipada y con unidades en el
      nombre de las columnas. Una fila por spw_id. Incremental con merge por spw_id: solo
      procesa cargas nuevas y, si una ventana viene en varias, se queda la más reciente. El
      post_hook delete_removed_spws borra las ventanas que no están en el último listado de
      claves del TAP. Es el modelo que leen los de la 3FN.
    columns:
      - name: spw_id
        description: "{{ doc('obscore_spw_id') }}"
        data_type: varchar
        data_tests:
          - not_null
          - unique
      - name: proposal_id
