# =============================================================================
#                           ALMA Project
# =============================================================================

name: CivicaProjectALMA
version: '1.0.0'

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]
clean-targets: ["target", "dbt_packages"]


# ========================= Models =========================
models:
  CivicaProjectALMA:
    +transient: false
  
    00_silver:
      +database: "{{ env_var('DBT_SILVER_DB') }}"

      staging:
        +schema: staging
        +materialized: view

      core:
        +schema: core
        +materialized: incremental
        +incremental_strategy: merge

    01_gold:
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      intermediate:
        +schema: intermediate
        +materialized: view
      core:
        +schema: core
        +materialized: incremental
        +incremental_strategy: merge
        +on_schema_change: fail
        +contract:
          enforced: true
   