name: CivicaProjectALMA
version: '1.0.0'

profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["docs"]
clean-targets: ["target", "dbt_packages"]


# ========================= Variables =========================
# example
#vars:
#  # Presupuesto anterior a esta fecha se descarta en slv_google_sheets__budget
#  budget_start_date: '2020-01-01'
